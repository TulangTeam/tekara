name: tekara
options:
  bundleIdPrefix: com.dimasdaffa 
  deploymentTarget:
    iOS: "26.0"          
  developmentLanguage: en

targets:
  tekara:
    type: application
    platform: iOS
    sources:
      - path: tekara
        excludes:
          - "Resources/Fonts/*.ttf"
          - "Resources/Fonts/*.otf"
      - path: tekara/Resources/Fonts/Baloo2-VariableFont_wght.ttf
        buildPhase: resources
    info:
      path: tekara/Info.plist
      properties:
        UILaunchScreen: {}
        # UIAppFonts intentionally omitted — font is loaded programmatically via CTFontManagerRegisterFontsForURL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimasdaffa.tekara
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: TekaraAssets
      - package: ThumbStickView
      - package: ControllerInput
      - package: WASDInput
      - package: DebugSwift

packages:
  TekaraAssets:
    path: Packages/TekaraAssets
  ThumbStickView:
    path: Packages/ThumbStickView
  ControllerInput:
    path: Packages/ControllerInput
  WASDInput:
    path: Packages/WASDInput
  DebugSwift:
    url: https://github.com/DebugSwift/DebugSwift.git
    from: "1.0.0" 